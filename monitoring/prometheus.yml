global:
  scrape_interval: 5s

scrape_configs:

  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

  - job_name: inference-api
    metrics_path: /prometheus/
    static_configs:
      - targets:
          - api:8000

  - job_name: inference-worker
    static_configs:
      - targets:
          - worker:8001

  - job_name: redis
    static_configs:
      - targets:
          - redis-exporter:9121

  - job_name: postgres
    static_configs:
      - targets:
          - postgres-exporter:9187