services:

  postgres:
    image: postgres:17-alpine

    environment:
      POSTGRES_USER: inference
      POSTGRES_PASSWORD: inference
      POSTGRES_DB: inference

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U inference -d inference"
        ]
      interval: 5s
      timeout: 5s
      retries: 10


  redis:
    image: redis:7-alpine

    volumes:
      - redis_data:/data

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]
      interval: 5s
      timeout: 3s
      retries: 10


  api:
    build: .

    command:
      [
        "uvicorn",
        "app.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000"
      ]

    ports:
      - "8000:8000"

    environment:
      DATABASE_URL: postgresql+psycopg://inference:inference@postgres:5432/inference
      REDIS_URL: redis://redis:6379/0

    depends_on:

      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy

    restart: unless-stopped


  worker:
    build: .

    command:
      [
        "python",
        "-m",
        "app.worker"
      ]

    environment:
      DATABASE_URL: postgresql+psycopg://inference:inference@postgres:5432/inference
      REDIS_URL: redis://redis:6379/0

    depends_on:

      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy

    restart: unless-stopped


volumes:

  postgres_data:

  redis_data: